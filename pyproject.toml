[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entity-github-app"
version = "0.1.0"
description = "Read-only GitHub App adapter that emits ENTITY evidence/provenance candidates."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Blackmore Technology Group Limited"}]
dependencies = []

[project.scripts]
entity-github-app = "entity_github_app.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
